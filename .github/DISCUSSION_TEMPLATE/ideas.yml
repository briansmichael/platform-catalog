title: "[idea] "
labels: [idea]
body:
  - type: dropdown
    id: system
    attributes:
      label: System
      options:
        - platform
        - ttug
        - areasontofly
        - n42bm
        - brianmichael
        - n5448p
        - starfireaviation
        - infrastructure
    validations: {required: true}
  - type: textarea
